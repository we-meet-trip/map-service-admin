<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}MAP · 운영 모니터링{% endblock %}</title>
  {% block head_extra %}{% endblock %}
  <style>
    /* ── 디자인 토큰 (라이트 우선 · 다크 자동) ───────────────────────────
       검증된 data-viz 팔레트 기반. 상태색(good/warning/serious/critical)은
       예약색이며 항상 글리프+라벨과 함께 쓴다(색 단독 신호 금지). */
    :root{
      color-scheme: light dark;
      --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f4f3ef;
      --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
      --hairline:rgba(11,11,11,.10); --gridline:#e1e0d9;
      --accent:#2a78d6; --accent-ink:#1c5cab;
      --cat-1:#2a78d6; --cat-2:#1baf7a;
      --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
      --good-tint:rgba(12,163,12,.10); --warning-tint:rgba(250,178,25,.15);
      --serious-tint:rgba(236,131,90,.15); --critical-tint:rgba(208,59,59,.10);
      --good-line:rgba(12,163,12,.40); --warning-line:rgba(250,178,25,.45);
      --serious-line:rgba(236,131,90,.45); --critical-line:rgba(208,59,59,.42);
      --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(11,11,11,.04);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232320;
        --ink:#fff; --ink-2:#c3c2b7; --muted:#928f88;
        --hairline:rgba(255,255,255,.11); --gridline:#2c2c2a;
        --accent:#3987e5; --accent-ink:#86b6ef;
        --cat-1:#3987e5; --cat-2:#199e70;
        --good-tint:rgba(12,163,12,.17); --warning-tint:rgba(250,178,25,.16);
        --serious-tint:rgba(236,131,90,.17); --critical-tint:rgba(208,59,59,.20);
        --shadow:none;
      }
    }

    /* ── reset ─────────────────────────────────────────────────────── */
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0; background:var(--plane); color:var(--ink);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;}
    a{color:var(--accent-ink); text-decoration:none}
    a:hover{text-decoration:underline}
    code{font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.85em}
    h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.01em}
    :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
    .muted{color:var(--muted)}
    .ink-2{color:var(--ink-2)}
    .tnum{font-variant-numeric: tabular-nums}
    .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
      overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

    /* ── 상태 pill (글리프 + 라벨, 라벨 잉크는 항상 가독) ─────────────── */
    .pill{display:inline-flex; align-items:center; gap:.35em; padding:.12rem .5rem;
      border-radius:999px; font-size:.76rem; font-weight:600; line-height:1.5;
      border:1px solid var(--hairline); color:var(--ink); white-space:nowrap}
    .pill .g{font-size:.85em; line-height:1}
    .pill.s0{background:var(--good-tint);     border-color:var(--good-line)}
    .pill.s1{background:var(--warning-tint);  border-color:var(--warning-line)}
    .pill.s2{background:var(--serious-tint);  border-color:var(--serious-line)}
    .pill.s3{background:var(--critical-tint); border-color:var(--critical-line)}
    .pill.s0 .g{color:var(--good)}    .pill.s1 .g{color:var(--warning)}
    .pill.s2 .g{color:var(--serious)} .pill.s3 .g{color:var(--critical)}
    .pill.neutral{background:var(--surface-2); border-color:var(--hairline); color:var(--ink-2)}

    /* ── 버튼 ──────────────────────────────────────────────────────── */
    .btn{display:inline-flex; align-items:center; gap:.4em; padding:.34rem .7rem;
      border:1px solid var(--hairline); border-radius:var(--r-sm); background:var(--surface);
      color:var(--ink); font:inherit; font-size:.85rem; font-weight:500; cursor:pointer;
      text-decoration:none; line-height:1.2}
    .btn:hover{background:var(--surface-2); text-decoration:none}
    .btn.accent{background:var(--accent); border-color:var(--accent); color:#fff}
    .btn.accent:hover{filter:brightness(.96)}
    .btn[aria-disabled="true"]{opacity:.45; pointer-events:none}
    .btn:disabled{opacity:.5; cursor:default}

    /* ── 카드 ──────────────────────────────────────────────────────── */
    .card{background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r);
      box-shadow:var(--shadow); padding:18px 22px; margin:0 0 18px; scroll-margin-top:76px}
    .card-head{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap;
      justify-content:space-between; margin-bottom:2px}
    .card-head .lead{display:flex; align-items:center; gap:10px; min-width:0}
    .card-glyph{flex:none; width:30px; height:30px; border-radius:8px; display:grid;
      place-items:center; background:var(--surface-2); color:var(--accent-ink);
      border:1px solid var(--hairline); font-size:.95rem}
    .card h2{font-size:1.02rem}
    .card-sub{font-size:.8rem; color:var(--muted); margin-top:1px}
    .card-body{margin-top:14px}
    hr.rule{border:0; border-top:1px solid var(--hairline); margin:14px -22px 0}

    /* ── 표 ────────────────────────────────────────────────────────── */
    .tbl-scroll{overflow-x:auto; margin:0 -4px}
    table.tbl{border-collapse:collapse; width:100%; font-size:.88rem}
    table.tbl th, table.tbl td{text-align:left; padding:.42rem .6rem;
      border-bottom:1px solid var(--hairline); vertical-align:baseline}
    table.tbl thead th{color:var(--muted); font-weight:600; font-size:.76rem;
      text-transform:uppercase; letter-spacing:.03em; white-space:nowrap}
    table.tbl tr:last-child td{border-bottom:0}
    table.tbl td.num, table.tbl th.num{text-align:right; font-variant-numeric:tabular-nums}
    table.tbl .kv{color:var(--muted); font-weight:600; width:44%}

    /* ── 알림/에러 블록 ───────────────────────────────────────────── */
    .notice{display:flex; gap:.6em; align-items:flex-start; padding:.7rem .85rem;
      border-radius:var(--r-sm); font-size:.86rem; border:1px solid var(--hairline)}
    .notice .g{flex:none; line-height:1.4}
    .notice.err{background:var(--critical-tint); border-color:var(--critical-line)}
    .notice.err .g{color:var(--critical)}
    .notice.empty{background:var(--surface-2); color:var(--ink-2)}
    .note{color:var(--muted); font-size:.78rem; margin:.55rem 0 0}

    /* ── 앱 셸 (레일 + 메인) ──────────────────────────────────────── */
    .app{display:block; min-height:100vh}
    @media (min-width:1100px){
      .app{display:grid; grid-template-columns:250px minmax(0,1fr); align-items:start}
    }
    .rail{background:var(--surface); border-bottom:1px solid var(--hairline)}
    @media (min-width:1100px){
      .rail{position:sticky; top:0; height:100vh; overflow:auto;
        border-bottom:0; border-right:1px solid var(--hairline)}
    }
    .rail-in{padding:18px 16px; display:flex; flex-direction:column; gap:14px}
    .brand{display:flex; align-items:center; gap:10px}
    .brand .mark{width:34px; height:34px; border-radius:9px; background:var(--ink);
      color:var(--plane); display:grid; place-items:center; font-weight:700; font-size:.82rem;
      letter-spacing:.02em}
    .brand .bt{font-weight:600; font-size:.92rem; line-height:1.15}
    .brand .bs{font-size:.72rem; color:var(--muted)}
    .rail nav{display:flex; flex-direction:column; gap:2px}
    @media (max-width:1099px){
      .rail nav{flex-direction:row; flex-wrap:nowrap; overflow-x:auto; gap:6px; padding-bottom:2px}
    }
    .rail nav a{display:flex; align-items:center; gap:9px; padding:.42rem .55rem;
      border-radius:var(--r-sm); color:var(--ink); font-size:.85rem; white-space:nowrap}
    .rail nav a:hover{background:var(--surface-2); text-decoration:none}
    .rail nav a.active{background:var(--surface-2); font-weight:600}
    .rail nav a .nm{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
    .rail nav a .ct{font-size:.74rem; color:var(--muted); font-variant-numeric:tabular-nums}
    /* 레일 상태 표시: 색이 아니라 '모양'으로 심각도를 구분(색 단독 금지) */
    .rdot{flex:none; width:14px; text-align:center; font-size:.72rem; line-height:1}
    .rdot.s0{color:var(--good)} .rdot.s1{color:var(--warning)}
    .rdot.s2{color:var(--serious)} .rdot.s3{color:var(--critical)}
    .rdot.sn{color:var(--muted); opacity:.7}
    .rail-foot{margin-top:auto; padding-top:12px; border-top:1px solid var(--hairline);
      font-size:.76rem; color:var(--muted); display:flex; flex-direction:column; gap:5px}
    .rail-foot .env{display:inline-flex; align-self:flex-start; gap:.35em; align-items:center;
      padding:.1rem .45rem; border-radius:999px; background:var(--surface-2);
      border:1px solid var(--hairline); color:var(--ink-2); font-weight:600}

    /* ── 메인 컬럼 ─────────────────────────────────────────────────── */
    .main{min-width:0}
    .main-in{max-width:1060px; margin:0 auto; padding:0 28px 48px}
    @media (max-width:640px){ .main-in{padding:0 14px 36px} }
    .subhead{position:sticky; top:0; z-index:15; background:var(--plane);
      background:color-mix(in srgb, var(--plane) 86%, transparent);
      backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--hairline);
      margin:0 -28px 0; padding:12px 28px}
    @media (max-width:640px){ .subhead{margin:0 -14px 0; padding:10px 14px} }
    .subhead-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:space-between}
    .subhead h1{font-size:1.14rem}
    .subhead .sub{font-size:.78rem; color:var(--muted); margin-top:1px}
    .refresh{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.8rem}
    .refresh .upd{color:var(--muted); font-variant-numeric:tabular-nums}
    .refresh label{display:inline-flex; align-items:center; gap:.4em; color:var(--ink-2)}
    .refresh select{font:inherit; font-size:.8rem; padding:.2rem .4rem; border-radius:6px;
      border:1px solid var(--hairline); background:var(--surface); color:var(--ink)}
    .progress{height:2px; background:transparent; margin:0 -28px; overflow:hidden}
    @media (max-width:640px){ .progress{margin:0 -14px} }
    .progress > i{display:block; height:100%; width:0; background:var(--accent);
      transition:width .95s linear}
    @media (prefers-reduced-motion: reduce){ .progress > i{transition:none} }

    /* ── 히어로 상태 밴드 ─────────────────────────────────────────── */
    .hero{display:flex; align-items:center; gap:14px; margin:20px 0 16px; padding:16px 20px;
      border-radius:var(--r); border:1px solid var(--hairline); background:var(--surface);
      box-shadow:var(--shadow)}
    .hero .bar{flex:none; width:4px; align-self:stretch; border-radius:3px; background:var(--muted)}
    .hero.s0 .bar{background:var(--good)} .hero.s1 .bar{background:var(--warning)}
    .hero.s2 .bar{background:var(--serious)} .hero.s3 .bar{background:var(--critical)}
    .hero .gm{flex:none; font-size:1.5rem; line-height:1}
    .hero.s0 .gm{color:var(--good)} .hero.s1 .gm{color:var(--warning)}
    .hero.s2 .gm{color:var(--serious)} .hero.s3 .gm{color:var(--critical)}
    .hero .verdict{font-size:1.28rem; font-weight:600; letter-spacing:-.01em}
    .hero .desc{font-size:.84rem; color:var(--ink-2); margin-top:2px}
    .hero .spacer{flex:1 1 auto}

    /* ── KPI 스탯 스트립 ──────────────────────────────────────────── */
    .kpi{display:grid; grid-template-columns:repeat(auto-fit, minmax(168px,1fr)); gap:12px;
      margin:0 0 22px}
    .tile{background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r);
      padding:13px 15px; display:flex; flex-direction:column; gap:5px; box-shadow:var(--shadow);
      scroll-margin-top:76px}
    .tile:hover{border-color:color-mix(in srgb, var(--accent) 40%, var(--hairline))}
    a.tile{color:inherit} a.tile:hover{text-decoration:none}
    .tile .lb{font-size:.76rem; color:var(--muted)}
    .tile .vl{font-size:1.5rem; font-weight:600; letter-spacing:-.02em; line-height:1.1}
    .tile .xt{font-size:.76rem; color:var(--ink-2)}

    /* ── 비율 바 (장소 출처) ─────────────────────────────────────── */
    .ratio{display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--surface-2);
      margin:.4rem 0 .1rem}
    .ratio > span{height:100%; border-right:2px solid var(--surface)}
    .ratio > span:last-child{border-right:0}
    .legend{display:flex; flex-wrap:wrap; gap:12px; font-size:.78rem; color:var(--ink-2); margin-top:.5rem}
    .legend .k{display:inline-flex; align-items:center; gap:.4em}
    .legend .sw{width:9px; height:9px; border-radius:2px; flex:none}

    /* ── 외부 모니터링 임베드 ────────────────────────────────────── */
    .embed{margin:0 0 16px; border:1px solid var(--hairline); border-radius:var(--r); overflow:hidden;
      background:var(--surface)}
    .embed-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:9px 13px;
      border-bottom:1px solid var(--hairline); background:var(--surface-2)}
    .embed-head .et{font-weight:600; font-size:.9rem}
    .embed-head .host{font-size:.74rem; color:var(--muted); background:var(--surface);
      border:1px solid var(--hairline); border-radius:6px; padding:.05rem .4rem}
    .embed-head .sp{flex:1 1 auto}
    .embed iframe{display:block; width:100%; border:0; background:var(--surface-2)}
    .embed-note{margin:0; padding:7px 13px; font-size:.74rem; color:var(--muted);
      border-top:1px solid var(--hairline)}
    .grid-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:14px}
    .lcard{border:1px solid var(--hairline); border-radius:var(--r); padding:14px 16px;
      background:var(--surface); display:flex; flex-direction:column; gap:8px}
    .lcard.pending{border-style:dashed; background:transparent}
    .lcard .lt{font-weight:600; font-size:.92rem; display:flex; align-items:center; gap:.5em; flex-wrap:wrap}
    .lcard .ld{font-size:.82rem; color:var(--ink-2)}
    .lcard .lu{font-size:.74rem; color:var(--muted); word-break:break-all}
    .lcard .lact{margin-top:auto}
    pre.example{margin:.5rem 0 0; padding:.7rem .8rem; background:var(--surface-2);
      border:1px solid var(--hairline); border-radius:var(--r-sm); overflow-x:auto;
      font-size:.76rem; line-height:1.5; color:var(--ink-2)}

    @media print{
      .rail, .refresh, .progress{display:none !important}
      .app{display:block} .card, .tile, .embed{break-inside:avoid; box-shadow:none}
      .subhead{position:static; backdrop-filter:none}
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
  {% block script %}{% endblock %}
</body>
</html>
