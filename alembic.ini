; Alembic 마이그레이션 도구 설정 (map-service-admin, cut 2).
;
; 본 INI 는 admin-service 의 admin_data 스키마 마이그레이션 진입점
; (migrations/env.py)이 참조하는 기본 설정값을 정의한다.
;
; 주의: sqlalchemy.url 은 본 파일에 비워 두고, env.py 가 환경변수
; ADMIN_DATABASE_URL(map_admin DSN)을 읽어 set_main_option 으로 주입한다.
; 자격증명을 평문으로 커밋하지 않기 위함이다. hub 의 alembic.ini 규약을
; 그대로 따르되 대상 스키마만 admin_data 이다.

; [alembic] — Alembic 본체 설정
;   script_location: 마이그레이션 환경 디렉터리(env.py 가 있는 위치)
;   version_locations: 개별 revision 파일이 들어가는 디렉터리
;   prepend_sys_path: cwd 를 sys.path 에 추가(현재 revision 은 app 미임포트)
;   version_path_separator: 여러 version_locations 를 OS 기본 구분자로 분리
;   sqlalchemy.url: env.py 에서 동적으로 채운다(빈 값)
[alembic]
script_location = migrations
version_locations = %(here)s/migrations/revisions
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

; === 로깅 설정 ===
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
